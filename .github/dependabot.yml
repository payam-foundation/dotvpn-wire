version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: build, include: scope}
    groups:
      all: {patterns: ["*"], update-types: [minor, patch]}
    ignore:
      # snowflake still needs the smux 1.x API (Config.Version, Stream.WriteTo).
      - dependency-name: github.com/xtaci/smux
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: ci, include: scope}
    groups:
      all: {patterns: ["*"], update-types: [minor, patch]}
