name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: SPDX header on every Go file
        run: |
          missing=$(git ls-files '*.go' | xargs grep -L 'SPDX-License-Identifier: AGPL-3.0-only OR PolyForm-Noncommercial-1.0.0' || true)
          test -z "$missing" || { echo "missing SPDX header:"; echo "$missing"; exit 1; }
      - run: go vet ./...
      # The golden vectors (TestGoldenRecord, TestGoldenKeys) are the wire
      # contract: a change to one is a wire break and needs a major version.
      - run: go test -race -count=1 ./...
      - name: fuzz smoke
        run: |
          for pkg in $(go list ./...); do
            for f in $(go test -list 'Fuzz.*' "$pkg" | grep '^Fuzz' || true); do
              go test -run '^$' -fuzz "^$f\$" -fuzztime 30s "$pkg"
            done
          done
      - name: VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -severity=high -exclude=G115,G404 -exclude-generated ./...
      - name: gitleaks
        run: |
          v=8.30.1
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner -v .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
