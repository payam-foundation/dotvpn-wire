name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # The golden vectors (TestGoldenRecord, TestGoldenKeys) are the wire
      # contract: a change to one is a wire break and needs a major version.
      - run: go test -race -count=1 ./...
      - name: fuzz smoke
        run: |
          for pkg in $(go list ./...); do
            for f in $(go test -list 'Fuzz.*' "$pkg" | grep '^Fuzz' || true); do
              go test -run '^$' -fuzz "^$f\$" -fuzztime 30s "$pkg"
            done
          done
      - name: VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$(cat VERSION)" = "${GITHUB_REF_NAME}"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.4 -exclude-generated ./...
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"

  # A library: the release is a signed tag and nothing else.
  release:
    needs: [test, security]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs the censorship lab (dotvpn-lab) against this PR. Needs a fine-grained
  # token with actions:write on dotvpn-lab in the LAB_DISPATCH_TOKEN secret;
  # without it the job is a no-op. The lab run is not linked back to this PR's
  # status: read it in the dotvpn-lab Actions tab.
  lab:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.LAB_DISPATCH_TOKEN }}
          REF: ${{ github.event.pull_request.head.sha }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "LAB_DISPATCH_TOKEN not set; skipping lab"; exit 0; }
          gh workflow run lab -R payam-foundation/dotvpn-lab -f wire_ref="$REF"
